<nav class="navbar navbar-expand-lg fixed-top" [class.scrolled]="scrolled">

    <div class="container">

        <a class="navbar-brand" href="#home" (click)="scrollToSection($event, 'home')">
            <span class="brand-mark">VA</span>
            <span class="brand-text">Vineesha Albert</span>
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto align-items-lg-center">

                <li class="nav-item" *ngFor="let id of sections">
                    <a class="nav-link"
                       [class.active]="activeSection === id"
                       [attr.href]="'#' + id"
                       (click)="scrollToSection($event, id)">
                        {{ id === 'home' ? 'Home' : (id | titlecase) }}
                    </a>
                </li>

                <li class="nav-item nav-cta">
                    <a class="btn btn-info btn-sm"
                       href="#contact"
                       (click)="scrollToSection($event, 'contact')">
                        Let's talk
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>
